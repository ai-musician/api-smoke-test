name: API Performance Smoke Test

on:
  pull_request:
    branches: [ main, master ]
    # Runs whenever a PR modifies backend or API-related code
    paths:
      - 'api/**'
      - 'backend/**'
      - 'smoke_test.py'

jobs:
  performance-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Spin Up / Deploy Test Environment
        run: |
          echo "Spinning up local API server or container..."
          # Example: python manage.py runserver & or docker-compose up -d

      - name: Run Performance Smoke Test
        env:
          TARGET_URL: "https://httpbin.org/get"
          RPS: "20"
          DURATION: "10"
          MAX_P99_MS: "1500"
          MAX_ERROR_RATE: "0.05"
        run: |
          python smoke_test.py > perf_results.txt
          cat perf_results.txt

      - name: Comment Results on Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('perf_results.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📊 API Performance Smoke Test Results\n\`\`\`\n${results}\n\`\`\``
            });
