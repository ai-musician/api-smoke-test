name: API Performance Smoke Test

on:
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run on direct pushes to main (this repo commits straight to main)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    # Optional: Only run when API/backend files or the test script changes
    paths:
      - 'api/**'
      - 'backend/**'
      - 'smoke_test.py'
      - '.github/workflows/api-performance-smoke-test.yml'

jobs:
  performance-smoke-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from your PR branch
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 in the GitHub Actions runner environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install required Python packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Start your API server in the background
      # (In this example, we start mock_server.py in the background using '&')
      - name: Start Mock API Server
        run: |
          python mock_server.py &
          # Give the server 2 seconds to initialize
          sleep 2

      # 5. Run the smoke test against the running server
      - name: Run Smoke Test
        run: |
          python smoke_test.py --base-url http://localhost:8080 > perf_results.txt
          cat perf_results.txt

      # 6. Post the smoke test results directly as a comment on the PR
      # Only on pull_request events — there is no PR to comment on for
      # push/manual runs, and the API call would fail the job
      - name: Comment Results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = '';
            try {
              results = fs.readFileSync('perf_results.txt', 'utf8');
            } catch (err) {
              results = 'Smoke test failed before generating output log.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📊 API Performance Smoke Test Results\n\`\`\`\n${results}\n\`\`\``
            });
